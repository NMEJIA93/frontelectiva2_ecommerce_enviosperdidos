services:
  # Development service - usa Vite dev server con hot reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: frontendecommerce-dev
    ports:
      - "${DEV_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
      - NODE_ENV=development
    command: npm run dev
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  ecommerce-network:
    driver: bridge
